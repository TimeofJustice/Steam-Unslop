name: Release

# Publishes the release of a version tag such as v2.0.0 (matching the version in package.json).
# The release notes are the section of CHANGELOG.md for that version.
# Runs for tags pushed by hand, and is called by tag.yml, which tags new versions on main: a tag
# pushed by a workflow starts no other workflow by itself.
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: The version tag to publish, e.g. v2.0.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - name: Check that the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$TAG"
      - run: npm ci
      - run: npm test
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - run: bun install --frozen-lockfile
        working-directory: platforms/millennium
      - run: npm run release
      - name: Release notes from CHANGELOG.md
        run: awk -v v="## ${TAG#v}" '$0 == v {on=1; next} /^## / {on=0} on' CHANGELOG.md > release/NOTES.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            release/*.zip
            release/*.star
          body_path: release/NOTES.md
