<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        box-sizing: border-box;
        width: 280px;
        margin: 0;
        padding: 14px 16px 16px;
        font:
          13px/1.45 "Motiva Sans",
          Arial,
          Helvetica,
          sans-serif;
        color: #c6d4df;
        background: #1b2838;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 15px;
        font-weight: 500;
        color: #fff;
      }
      label {
        display: block;
        margin-bottom: 4px;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #7a8c99;
      }
      select {
        width: 100%;
        height: 28px;
        padding: 0 8px;
        border: 0;
        border-radius: 2px;
        cursor: pointer;
        font: inherit;
        color: #c6d4df;
        background: rgba(255, 255, 255, 0.1);
      }
      select:focus-visible {
        outline: 2px solid #67c1f5;
        outline-offset: 1px;
      }
      option {
        color: #000;
      }
      p {
        margin: 10px 0 0;
        font-size: 12px;
        color: #8f98a0;
      }
    </style>
  </head>
  <body>
    <h1 data-i18n="extName"></h1>
    <label for="min-level" data-i18n="minLevel"></label>
    <select id="min-level"></select>
    <p data-i18n="settingsHint"></p>
    <script src="popup.js"></script>
  </body>
</html>
