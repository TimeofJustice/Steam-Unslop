[plugin]
id = "steam-unslop"
name = "Steam Unslop"
version = "1.6.2"
author = "TimeofJustice"
description = "Blurs games with an AI disclosure in the Steam store and shows how strongly and for what AI was used."

[frontend]
entry = "frontend/index.tsx"

[webkit]
entry = "webview/preload.ts"

[compiler]
# auto: detect the Millennium installation and install the plugin there
output_path = "auto"
